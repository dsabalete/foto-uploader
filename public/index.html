<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foto-uploader</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="shell">
    <section class="card auth-card" id="authCard">
      <h1>Acceso privado</h1>
      <p class="subtitle">Introduce la contraseña para usar el subidor de fotos.</p>

      <form id="loginForm" class="login-form">
        <label class="field">
          <span>Contraseña</span>
          <input id="passwordInput" type="password" autocomplete="current-password" />
        </label>
        <button id="loginBtn" type="submit">Entrar</button>
      </form>

      <p id="authStatus" class="status"></p>
    </section>

    <main class="card app-card" id="appCard" hidden>
      <div class="card-header">
        <div>
          <h1>Backup de fotos y vídeos</h1>
          <p class="subtitle">
            Selecciona archivos sueltos o una carpeta completa y elige el bucket de destino.
          </p>
        </div>
        <button id="logoutBtn" type="button" class="ghost">Salir</button>
      </div>

      <div class="field">
        <label>
          <span>Destino</span>
          <select id="destinationSelect">
            <option value="image">Bucket de imágenes</option>
            <option value="video">Bucket de vídeos</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="pickFilesBtn" type="button">Elegir archivos</button>
        <button id="pickFolderBtn" type="button">Elegir carpeta</button>
      </div>

      <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden />
      <input id="folderInput" type="file" accept="image/*,video/*" multiple webkitdirectory hidden />

      <button id="uploadBtn" disabled>Subir archivos</button>

      <p id="selection" class="selection"></p>
      <progress id="progress" max="100" value="0" hidden></progress>
      <p id="status" class="status"></p>
      <p id="summary" class="summary"></p>
      <a id="objectLink" target="_blank" rel="noreferrer"></a>
    </main>
  </main>

  <script src="app.js"></script>
</body>

</html>
